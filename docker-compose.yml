# استقرار فیروزه روی یک مینی‌پی‌سی / لینوکس / ویندوز با Docker Desktop.
#   docker compose up -d --build
# داده و پشتیبان روی میزبان می‌مانند: ./data و ./backups
services:
  crm:
    build: .
    container_name: firoozeh-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:../data/crm.db"
      COOKIE_SECURE: "auto"
      TZ: "Asia/Tehran"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
